spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/memora_db}
    username: ${DB_USERNAME:memora_admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        highlight_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # SMTP 서버가 응답하지 않을 때 요청이 무한정 기다리지 않도록 제한 (ms)
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  scheduling:
    default-timezone: Asia/Seoul

server:
  address: 0.0.0.0
  port: 8080

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

management:
  health:
    mail:
      enabled: false

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 31536000000    # 1년
  refresh-token-validity: 31536000000   # 1년

gemini:
  api-key: ${GEMINI_API_KEY}
  endpoint: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
